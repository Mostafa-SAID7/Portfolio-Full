services:
  web:
    image: oven/bun:1.2
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_SITE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
