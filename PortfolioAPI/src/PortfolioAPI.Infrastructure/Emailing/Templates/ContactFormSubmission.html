<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New contact form submission</title>
</head>
<!--
    Contact form notification sent to the admin when a visitor submits
    the portfolio contact form. Placeholders {{...}} are replaced by
    EmailTemplateRenderer; every user-supplied value is HTML-encoded by
    EmailService BEFORE substitution, so these slots are safe.
-->
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="620" cellpadding="0" cellspacing="0" style="width:620px;max-width:100%;background-color:#ffffff;border-radius:10px;border:1px solid #e4e6ea;">
                    <tr>
                        <td style="padding:20px 28px;border-bottom:1px solid #eef0f3;border-radius:10px 10px 0 0;background-color:#111827;color:#f9fafb;font-size:17px;font-weight:600;">
                            New Contact Form Submission
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px 28px;color:#1f2937;font-size:15px;line-height:1.6;">
                            <p style="margin:0 0 14px;">
                                <strong style="color:#6b7280;">From:</strong>
                                {{FromName}} (<a href="mailto:{{FromEmail}}" style="color:#2563eb;text-decoration:none;">{{FromEmail}}</a>)
                            </p>
                            <p style="margin:0 0 14px;">
                                <strong style="color:#6b7280;">Subject:</strong> {{Subject}}
                            </p>
                            <p style="margin:0 0 6px;"><strong style="color:#6b7280;">Message:</strong></p>
                            <div style="margin:0 0 18px;padding:14px 16px;background-color:#f9fafb;border:1px solid #eef0f3;border-radius:8px;color:#111827;line-height:1.6;">
                                {{MessageHtml}}
                            </div>
                            <hr style="border:none;border-top:1px solid #eef0f3;margin:18px 0;" />
                            <p style="margin:0;color:#9ca3af;font-size:13px;">
                                <em>This message was sent from the portfolio contact form.</em>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
