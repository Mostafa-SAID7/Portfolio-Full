<!-- About Section -->
<section class="portfolio-section">
  <div class="container">
    <h1 class="section-title">About Me</h1>

    <div class="row" *ngIf="aboutSection">
      <div class="col-lg-8 mx-auto">
        <div class="about-content" [innerHTML]="aboutSection.content"></div>
      </div>
    </div>
  </div>
</section>

<!-- Experience Section -->
<section class="portfolio-section bg-light" *ngIf="experienceItems.length > 0">
  <div class="container">
    <h2 class="section-title">Professional Experience</h2>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experienceItems; let i = index">
        <div class="timeline-marker"></div>
        <div class="timeline-content">
          <div class="experience-card card">
            <div class="card-body">
              <h5 class="card-title">{{exp.title}}</h5>
              <h6 class="card-subtitle mb-2 text-muted">{{exp.description}}</h6>
              <div class="experience-meta">
                <span class="badge bg-primary me-2" *ngIf="exp.technologies">{{exp.technologies}}</span>
              </div>
              <div [innerHTML]="exp.content" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Education Section -->
<section class="portfolio-section" *ngIf="educationItems.length > 0">
  <div class="container">
    <h2 class="section-title">Education</h2>

    <div class="row">
      <div class="col-md-6 mb-4" *ngFor="let edu of educationItems">
        <div class="education-card card h-100">
          <div class="card-body">
            <div class="education-icon mb-3">
              <i class="fas fa-graduation-cap fa-2x text-primary"></i>
            </div>
            <h5 class="card-title">{{edu.title}}</h5>
            <h6 class="card-subtitle mb-2 text-muted">{{edu.description}}</h6>
            <div [innerHTML]="edu.content" class="mt-3"></div>
            <div class="mt-3" *ngIf="edu.technologies">
              <small class="text-muted">
                <strong>Focus Areas:</strong> {{edu.technologies}}
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Call to Action -->
<section class="portfolio-section bg-primary text-white">
  <div class="container text-center">
    <h2 class="section-title text-white">Let's Connect</h2>
    <p class="section-subtitle text-white-50">I'm always interested in discussing new opportunities and interesting projects</p>
    <a routerLink="/contact" class="btn btn-light btn-lg">Get In Touch</a>
  </div>
</section>
