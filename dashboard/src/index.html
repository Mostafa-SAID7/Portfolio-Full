<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Portfolio Admin — Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Admin dashboard for the Portfolio API: projects, content, messages and site stats.">
  <meta name="theme-color" content="#14100d">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">

  <!-- Self-hosted web fonts: preloaded in <head> so they are discovered before CSS/JS
     evaluation (avoids render-blocking stylesheet + late font swap CLS). -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
