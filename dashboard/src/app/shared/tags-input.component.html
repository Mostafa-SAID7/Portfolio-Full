<div class="relative">
  <label [attr.for]="inputId" class="field-label">{{ label }}</label>
  <div class="input flex flex-wrap items-center gap-1.5" [class]="inputClass"
    [class.opacity-60]="disabled()" [class.cursor-not-allowed]="disabled()" (click)="focusInput()">
    @for (tag of tags(); track tag) {
      <span class="inline-flex items-center gap-1 rounded-md bg-accent/10 px-2 py-1 text-xs font-semibold text-accent-text">
        {{ tag }}
        <button type="button" class="text-accent-text/70 transition hover:text-danger disabled:cursor-not-allowed"
          [disabled]="disabled()" (click)="removeTag(tag, $event)" [attr.aria-label]="'Remove ' + tag">
          &times;
        </button>
      </span>
    }
    <input [id]="inputId" type="text"
      class="min-w-[9rem] flex-1 bg-transparent text-sm text-ink outline-none placeholder:text-faint disabled:cursor-not-allowed"
      [disabled]="disabled()" [placeholder]="tags().length ? '' : placeholder" [value]="draft()" autocomplete="off"
      role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
      [attr.aria-expanded]="open() && filteredSuggestions().length > 0"
      [attr.aria-controls]="open() && filteredSuggestions().length ? listId : null"
      [attr.aria-activedescendant]="activeDescendant"
      (input)="onInput($event)" (keydown)="onKeydown($event)" (focus)="onFocus()" (blur)="onBlur()"
    />
  </div>
  @if (open() && filteredSuggestions().length) {
    <ul [id]="listId" role="listbox" [attr.aria-label]="label"
      class="absolute z-50 mt-1 max-h-56 w-full overflow-auto rounded-xl border border-line/15 bg-raised py-1 shadow-card">
      @for (suggestion of filteredSuggestions(); track $index) {
        <li role="option" [id]="optionId($index)" [attr.aria-selected]="tags().includes(suggestion)"
          class="flex cursor-pointer items-center justify-between gap-2 px-4 py-2 text-sm transition hover:bg-line/[0.06] hover:text-ink"
          [class]="active() === suggestion ? 'bg-line/[0.06] text-ink' : 'text-soft'"
          (mouseenter)="setActive(suggestion)" (mousedown)="$event.preventDefault()" (click)="addTag(suggestion)">
          <span class="truncate">{{ suggestion }}</span>
        </li>
      }
    </ul>
  }
  @if (hint) {
    <p class="mt-2 text-xs text-muted">{{ hint }}</p>
  }
</div>
