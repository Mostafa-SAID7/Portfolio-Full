<div class="relative">
  @if (label) {
    <label [attr.for]="inputId" class="field-label">{{ label }}</label>
  }

  <!-- Trigger Button -->
  <button
    [id]="inputId"
    type="button"
    class="input flex items-center justify-between gap-2.5 text-left transition select-none disabled:cursor-not-allowed disabled:opacity-60"
    [class]="inputClass"
    [disabled]="disabled()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    (click)="toggle()"
  >
    <div class="flex items-center gap-2 min-w-0">
      <svg class="h-4 w-4 shrink-0 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="truncate" [class.text-faint]="!value()" [class.text-ink]="value()">
        {{ displayValue() || placeholder }}
      </span>
    </div>
    <svg class="h-3.5 w-3.5 shrink-0 text-muted transition-transform duration-150" [class.rotate-180]="open()" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6" />
    </svg>
  </button>

  <!-- Calendar Popup Dropdown -->
  @if (open()) {
    <div
      role="dialog"
      aria-label="Calendar date selector"
      class="absolute z-50 mt-1.5 w-72 rounded-2xl border border-line/15 bg-raised p-3.5 shadow-card backdrop-blur-xl animate-in fade-in zoom-in-95 duration-100"
    >
      <!-- Header: Month/Year navigation -->
      <div class="mb-3 flex items-center justify-between">
        <button
          type="button"
          class="icon-btn !h-7 !w-7"
          (click)="prevMonth()"
          aria-label="Previous month"
        >
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m15 19-7-7 7-7" />
          </svg>
        </button>

        <span class="font-display text-xs font-bold text-ink">
          {{ monthLabel() }}
        </span>

        <button
          type="button"
          class="icon-btn !h-7 !w-7"
          (click)="nextMonth()"
          aria-label="Next month"
        >
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7" />
          </svg>
        </button>
      </div>

      <!-- Weekday headers -->
      <div class="mb-1 grid grid-cols-7 text-center">
        @for (wd of weekDays; track wd) {
          <span class="type-micro font-bold uppercase tracking-wider text-muted">
            {{ wd }}
          </span>
        }
      </div>

      <!-- Days Grid (42 cells: 6 rows x 7 cols) -->
      <div class="grid grid-cols-7 gap-1">
        @for (calDay of calendarDays(); track calDay.iso) {
          <button
            type="button"
            class="h-8 w-8 rounded-lg text-xs font-medium transition flex items-center justify-center select-none"
            [class.bg-accent]="calDay.isSelected"
            [class.text-on-accent]="calDay.isSelected"
            [class.font-bold]="calDay.isSelected || calDay.isToday"
            [class.shadow-accent-glow]="calDay.isSelected"
            [class.border]="calDay.isToday && !calDay.isSelected"
            [class.border-accent/40]="calDay.isToday && !calDay.isSelected"
            [class.text-accent-text]="calDay.isToday && !calDay.isSelected"
            [class.text-ink]="calDay.isCurrentMonth && !calDay.isSelected && !calDay.isToday && !calDay.isDisabled"
            [class.text-faint]="!calDay.isCurrentMonth && !calDay.isSelected && !calDay.isDisabled"
            [class.opacity-35]="!calDay.isCurrentMonth && !calDay.isSelected"
            [class.hover:bg-line/[0.08]]="!calDay.isSelected && !calDay.isDisabled"
            [class.cursor-not-allowed]="calDay.isDisabled"
            [class.opacity-25]="calDay.isDisabled"
            [disabled]="calDay.isDisabled"
            (click)="selectDay(calDay)"
          >
            {{ calDay.day }}
          </button>
        }
      </div>

      <!-- Footer Actions -->
      <div class="mt-3 flex items-center justify-between border-t border-line/10 pt-2.5">
        <button
          type="button"
          class="text-xs font-semibold text-soft transition hover:text-ink"
          (click)="clear()"
        >
          Clear
        </button>
        <button
          type="button"
          class="text-xs font-bold text-accent-text transition hover:underline"
          (click)="selectToday()"
        >
          Today
        </button>
      </div>
    </div>
  }
</div>
